<g transform="translate(128,303) scale(0.9166666666666666)" fill="none" stroke="#60A5FA" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16 M4 12h16 M4 17h10"/></g>
