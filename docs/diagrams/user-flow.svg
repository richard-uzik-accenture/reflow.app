<text class="t" x="98" y="604" text-anchor="middle" font-size="15" font-weight="600" fill="#0B1120">4</text>
<g transform="translate(128,586) scale(0.9166666666666666)" fill="none" stroke="#60A5FA" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l5 5 9-11"/></g>
<text class="t" x="160" y="604" font-size="15" font-weight="600" fill="#F1F5F9">Work down the list</text>
