<text class="t" x="98" y="453" text-anchor="middle" font-size="15" font-weight="600" fill="#0B1120">3</text>
<g transform="translate(128,435) scale(0.9166666666666666)" fill="none" stroke="#60A5FA" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h12 M13 5l3 3-3 3 M20 16H8 M11 13l-3 3 3 3"/></g>
