<svg xmlns="http://www.w3.org/2000/svg" width="870" height="700" viewBox="0 0 870 700" role="img" aria-label="How a change reaches people">
<title>How a change reaches people</title>
<style>
  @media (prefers-color-scheme: dark) {
    .layer-l { display: none; }
    .layer-d { display: inline !important; }
  }
</style>
<g class="layer-l">
<style>
  .layer-l .t { font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; fill: #0B1120; }
  .layer-l .mono { font-family: ui-monospace, 'Cascadia Mono', 'Consolas', monospace; }
  .layer-l .muted { fill: #475569; }
  .layer-l .title { font-size: 21px; font-weight: 600; letter-spacing: -0.3px; }
  .layer-l .subtitle { font-size: 12.5px; fill: #475569; }
  .layer-l .h { font-size: 13.5px; font-weight: 600; }
  .layer-l .b { font-size: 12px; }
  .layer-l .s { font-size: 10.5px; }
  .layer-l .box { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.25; }
  .layer-l .box-alt { fill: #F1F5F9; stroke: #E2E8F0; stroke-width: 1.25; }
  .layer-l .group { fill: none; stroke: #94A3B8; stroke-width: 1.25; stroke-dasharray: 5 4; opacity: 0.75; }
  .layer-l .edge { fill: none; stroke: #94A3B8; stroke-width: 1.5; }
  .layer-l .edge-accent { fill: none; stroke: #2563EB; stroke-width: 1.75; }
  .layer-l .edge-dash { fill: none; stroke: #475569; stroke-width: 1.25; stroke-dasharray: 4 4; }
</style>
<defs>
  <marker id="arrow-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
  </marker>
  <marker id="arrow-accent-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
  </marker>
  <marker id="arrow-muted-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
  </marker>
  <marker id="crowsfoot-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto">
    <path d="M10,0 L0,5 L10,10 M10,5 L0,5" fill="none" stroke="#94A3B8" stroke-width="1.4"/>
  </marker>
</defs>
<rect width="870" height="700" fill="#F8FAFC"/>
<text class="t title" x="32" y="42">How a change reaches people</text>
<text class="t subtitle" x="32" y="63">Built once, then promoted through three environments — production always ships what was tested.</text>
<rect x="60" y="140" width="330" height="125" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.25"/>
<rect x="80" y="155" width="26" height="26" rx="8" fill="#2563EB"/>
<g transform="translate(85,160) scale(0.6666666666666666)" fill="none" stroke="#FFFFFF" stroke-width="2.63" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v10 M6 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z M6 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z M18 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z M18 10v2a4 4 0 0 1-4 4H6"/></g>
<text class="t" x="118" y="173" font-size="14.5" font-weight="600" fill="#0B1120">Write the code</text>
<text class="t s" x="118" y="202" fill="#475569">feature branch  →  dev  →  main</text>
<text class="t s" x="118" y="221" fill="#475569">dev is where things get tried out</text>
<text class="t s" x="118" y="240" fill="#475569">only a human may merge into main</text>
<rect x="60" y="330" width="330" height="125" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.25"/>
<rect x="80" y="345" width="26" height="26" rx="8" fill="#2563EB"/>
<g transform="translate(85,350) scale(0.6666666666666666)" fill="none" stroke="#FFFFFF" stroke-width="2.63" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3 5 14h6l-1 7 8-11h-6l1-7Z"/></g>
<text class="t" x="118" y="363" font-size="14.5" font-weight="600" fill="#0B1120">Build it once</text>
<text class="t s" x="118" y="392" fill="#475569">GitHub Actions runs on every push to main</text>
<text class="t s" x="118" y="411" fill="#475569">It builds the app and hands the result to</text>
<text class="t s" x="118" y="430" fill="#475569">Octopus. It never deploys anything itself.</text>
<rect x="60" y="540" width="330" height="125" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.25"/>
<rect x="80" y="555" width="26" height="26" rx="8" fill="#2563EB"/>
<g transform="translate(85,560) scale(0.6666666666666666)" fill="none" stroke="#FFFFFF" stroke-width="2.63" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 2 5 5.5 5 9.5l-2.5 2.5h-5L7 12.5C7 8.5 9 5 12 3Z M9.5 15 8 20l3-1.5 3 1.5-1.5-5 M12 10h.01"/></g>
<text class="t" x="118" y="573" font-size="14.5" font-weight="600" fill="#0B1120">Promote that same build</text>
<text class="t s" x="118" y="602" fill="#475569">Octopus moves one build through all three</text>
<text class="t s" x="118" y="621" fill="#475569">environments — nothing is ever rebuilt, so</text>
<text class="t s" x="118" y="640" fill="#475569">what reaches production is what was tested.</text>
<path class="edge" d="M225,278 V326" marker-end="url(#arrow-l)"/>
<path class="edge" d="M225,468 V536" marker-end="url(#arrow-l)"/>
<text class="t h" x="470" y="132" text-anchor="start" >Where it lands</text>
<rect x="470" y="148" width="340" height="92" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.25"/>
<text class="t" x="490" y="178" font-size="14.5" font-weight="600" fill="#0B1120">DEV</text>
<text class="t mono s" x="490" y="200" fill="#475569">dev.usereflow.app</text>
<rect x="490" y="212" width="150.20000000000002" height="18" rx="9" fill="#DBEAFE"/>
<text class="t s" x="500" y="225" fill="#2563EB" font-weight="600">deploys automatically</text>
<rect x="470" y="264" width="340" height="92" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="1.25"/>
<text class="t" x="490" y="294" font-size="14.5" font-weight="600" fill="#0B1120">QUALITY</text>
<text class="t mono s" x="490" y="316" fill="#475569">quality.usereflow.app</text>
<rect x="490" y="328" width="131.60000000000002" height="18" rx="9" fill="#FEF3C7"/>
<text class="t s" x="500" y="341" fill="#D97706" font-weight="600">waits for a person</text>
<rect x="470" y="380" width="340" height="92" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="1.25"/>
<text class="t" x="490" y="410" font-size="14.5" font-weight="600" fill="#0B1120">PRODUCTION</text>
<text class="t mono s" x="490" y="432" fill="#475569">usereflow.app</text>
<rect x="490" y="444" width="131.60000000000002" height="18" rx="9" fill="#FEF3C7"/>
<text class="t s" x="500" y="457" fill="#D97706" font-weight="600">waits for a person</text>
<path class="edge" d="M394,576 H432 V194 H466" marker-end="url(#arrow-l)"/>
<path class="edge" d="M432,310 H466" marker-end="url(#arrow-l)"/>
<path class="edge" d="M432,426 H466" marker-end="url(#arrow-l)"/>
<rect class="box-alt" x="470" y="500" width="340" height="132" rx="14" />
<g transform="translate(490,518) scale(0.8333333333333334)" fill="none" stroke="#2563EB" stroke-width="2.10" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7c4.4 0 8-1.3 8-3s-3.6-3-8-3-8 1.3-8 3 3.6 3 8 3Z M4 4v16c0 1.7 3.6 3 8 3s8-1.3 8-3V4 M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
<text class="t b" x="520" y="534" text-anchor="start" font-weight="600">Each environment has its own data</text>
<text class="t s muted" x="520" y="558" text-anchor="start" >DEV and QUALITY share one Supabase project,</text>
<text class="t s muted" x="520" y="576" text-anchor="start" >kept apart by using a separate schema each.</text>
<text class="t s muted" x="520" y="600" text-anchor="start" >Production sits in a project of its own, so real</text>
<text class="t s muted" x="520" y="618" text-anchor="start" >data never shares a home with test data.</text>
</g>
<g class="layer-d" display="none">
<style>
  .layer-d .t { font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; fill: #F1F5F9; }
  .layer-d .mono { font-family: ui-monospace, 'Cascadia Mono', 'Consolas', monospace; }
  .layer-d .muted { fill: #94A3B8; }
  .layer-d .title { font-size: 21px; font-weight: 600; letter-spacing: -0.3px; }
  .layer-d .subtitle { font-size: 12.5px; fill: #94A3B8; }
  .layer-d .h { font-size: 13.5px; font-weight: 600; }
  .layer-d .b { font-size: 12px; }
  .layer-d .s { font-size: 10.5px; }
  .layer-d .box { fill: #1E293B; stroke: #2E3B4E; stroke-width: 1.25; }
  .layer-d .box-alt { fill: #152033; stroke: #2E3B4E; stroke-width: 1.25; }
  .layer-d .group { fill: none; stroke: #5B6B84; stroke-width: 1.25; stroke-dasharray: 5 4; opacity: 0.75; }
  .layer-d .edge { fill: none; stroke: #5B6B84; stroke-width: 1.5; }
  .layer-d .edge-accent { fill: none; stroke: #60A5FA; stroke-width: 1.75; }
  .layer-d .edge-dash { fill: none; stroke: #94A3B8; stroke-width: 1.25; stroke-dasharray: 4 4; }
</style>
<defs>
  <marker id="arrow-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5B6B84"/>
  </marker>
  <marker id="arrow-accent-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#60A5FA"/>
  </marker>
  <marker id="arrow-muted-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
  </marker>
  <marker id="crowsfoot-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto">
    <path d="M10,0 L0,5 L10,10 M10,5 L0,5" fill="none" stroke="#5B6B84" stroke-width="1.4"/>
  </marker>
</defs>
